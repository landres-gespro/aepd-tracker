  name: AEPD Scraper Diario

  on:
    workflow_dispatch: # Permite ejecutarlo manualmente con un botón
    schedule:
      - cron: '0 3 * * *' # Se ejecuta todos los días a las 03:00 AM UTC

  jobs:
    scrape:
      runs-on: ubuntu-latest
      steps:
        - name: 1. Clonar el repositorio
          uses: actions/checkout@v4

        - name: 2. Instalar Python
          uses: actions/setup-python@v5
          with:
            python-version: '3.11'

        - name: 3. Instalar librerías (requirements.txt)
          run: |
            python -m pip install --upgrade pip
            pip install -r requirements.txt

        - name: 4. Ejecutar el Script
          run: python src/scraper.py

        - name: 5. Guardar los nuevos datos en GitHub (Commit automático)
          run: |
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add data/resultados.csv
            # Si hay cambios, los sube. Si no, no hace nada.
            git commit -m "Actualizacion automatica de resoluciones AEPD" || echo "No hay resoluciones nuevas hoy"
            git push
