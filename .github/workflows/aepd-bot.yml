name: AEPD Scraper Diario

on:
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * *'

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: 1. Clonar el repositorio
        uses: actions/checkout@v4

      - name: 2. Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 3. Instalar librerías y Navegador Fantasma
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # Esta línea descarga Google Chrome en el servidor de GitHub
          playwright install --with-deps chromium

      - name: 4. Ejecutar el Script
        run: python src/scraper.py

      - name: 5. Guardar los nuevos datos en GitHub (Solo si existen)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          if [ -f "data/resultados.csv" ]; then
            git add data/resultados.csv
            git commit -m "Actualizacion automatica de resoluciones AEPD" || echo "No hay cambios en el CSV"
            git push
          else
            echo "⚠️ El archivo no se creó."
          fi
